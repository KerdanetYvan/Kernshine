name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # La version de l'application vient de package.json (Tauri la lit de là) :
      # un tag qui ne lui correspond pas produirait un installeur mal numéroté.
      - name: Check tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Le tag ($TAG_VERSION) ne correspond pas à la version de package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Sans la clé, l'installeur ne serait pas signé et l'app refuserait la mise à jour :
      # mieux vaut s'arrêter tout de suite avec un message clair.
      - name: Check signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY manquant : impossible de signer la mise à jour (voir CLAUDE.md, « Mises à jour de Kernshine »)"
            exit 1
          fi

      # tauri.release.conf.json active la signature (createUpdaterArtifacts) : un .sig
      # est produit à côté de l'installeur. Les builds locaux n'en ont pas besoin.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Prepare installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)"
          DEST="Kernshine-${VERSION}-setup.exe"
          cp "$SRC" "$DEST"
          cp "$SRC.sig" "$DEST.sig"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          INSTALLER="${{ steps.installer.outputs.file }}"

          node scripts/extract-changelog.mjs "$VERSION" > changelog-section.md

          {
            cat docs/PRESENTATION.md
            echo
            echo '---'
            echo
            cat changelog-section.md
            echo
            echo '---'
            echo
            echo '## Installation'
            echo
            echo "1. Téléchargez \`$INSTALLER\` ci-dessous."
            echo '2. Lancez l’installeur. Windows peut afficher un avertissement SmartScreen (l’application n’est pas encore signée) : cliquez sur "Informations complémentaires" puis "Exécuter quand même".'
            echo '3. Une fois l’installation terminée, lancez Kernshine depuis le menu Démarrer.'
            echo
            echo '## Vérification'
            echo
            echo '```'
            sha256sum "$INSTALLER"
            echo '```'
          } > full-release-body.md

      - name: Determine prerelease flag
        id: prerelease
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          gh release create "$TAG" \
            --title "Kernshine $VERSION" \
            --notes-file full-release-body.md \
            ${{ steps.prerelease.outputs.flag }} \
            "${{ steps.installer.outputs.file }}"

      # Les apps installées lisent releases/download/canal-alpha/latest.json
      # (plugins > updater > endpoints dans tauri.conf.json). GitHub ignore les
      # pré-versions dans « latest » : d'où cette release fixe, mise à jour à chaque version.
      - name: Publish update manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          INSTALLER="${{ steps.installer.outputs.file }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${INSTALLER}"

          node scripts/updater-manifest.mjs "$VERSION" "$URL" "$INSTALLER.sig" changelog-section.md latest.json

          if ! gh release view canal-alpha >/dev/null 2>&1; then
            gh release create canal-alpha --prerelease \
              --title "Canal de mise à jour (alpha)" \
              --notes "Fichier lu par Kernshine pour savoir si une nouvelle version existe. Ne pas supprimer : les apps installées ne trouveraient plus leurs mises à jour."
          fi
          gh release upload canal-alpha latest.json --clobber
